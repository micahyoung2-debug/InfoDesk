// Pages dissolve into each other. The next page is built hidden underneath and fully drawn, its images
// decoded, then the old page (on top) fades out alone. Only one layer ever changes, so the blend is
// even all the way through, with no dimming in the middle, and the browser's compositor runs it on its own.
// While it runs, the old page is frozen (its updates stopped) and the new page waits to start animating.
let dissolving = null;
function finishDissolve(){
  if (!dissolving) return;
  const d = dissolving; dissolving = null;
  if (d.anim) try { d.anim.cancel(); } catch(e){}
  if (!d.frozen) d.oldLive.forEach(l => { try { l.destroy && l.destroy(); } catch(e){} });
  d.oldGrid.remove();
  grid.classList.remove('dissolve-in'); grid.style.visibility = '';
  document.body.classList.remove('dissolving');
}
const nextFrame = () => new Promise(r => requestAnimationFrame(r));
function goPage(i, quick){
  const n = pageCount(); i = ((i % n) + n) % n;
  pageIdle = 0;
  if (i === curPage && !quick) return;
  finishDissolve();
  selId = null; if (drawer.classList.contains('open')) closeDrawer();
  if (quick || calm() || !grid.animate){ curPage = i; render(); drawPageBar(); return; }
  const oldGrid = grid, oldLive = live;
  const next = oldGrid.cloneNode(false);
  next.classList.add('dissolve-in'); next.style.visibility = 'hidden';
  oldGrid.removeAttribute('id'); oldGrid.classList.add('dissolve-out');
  oldGrid.after(next); grid = next;
  live = []; curPage = i; render(); drawPageBar();
  const d = dissolving = {oldGrid, oldLive, fading:false, frozen:false, anim:null};
  const alive = () => dissolving === d;
  (async () => {
    // 1. let the hidden page lay out and size its canvases, then draw every zone once
    await nextFrame(); await nextFrame(); if (!alive()) return;
    live.forEach(l => { try { l.frame && l.frame(performance.now(), 16); } catch(e){} });
    // 2. decode any images on the new page so none pop in or stall the fade (never wait more than 0.7 s)
    const imgs = [...next.querySelectorAll('img')].filter(im => im.src);
    await Promise.race([Promise.allSettled(imgs.map(im => im.decode ? im.decode() : null)), new Promise(r => setTimeout(r, 700))]);
    if (!alive()) return;
    // 3. freeze the old page and pause everything that would repaint during the fade
    oldLive.forEach(l => { try { l.destroy && l.destroy(); } catch(e){} }); d.frozen = true;
    d.fading = true; document.body.classList.add('dissolving');
    next.style.visibility = '';
    await nextFrame(); await nextFrame(); if (!alive()) return;  // new page painted underneath before anything moves
    // 4. fade the old page away
    d.anim = oldGrid.animate([{opacity:1}, {opacity:0}], {duration:1800, easing:'cubic-bezier(.37,0,.63,1)', fill:'forwards'});

  })();
}
function pagesApply(){

}

/* ---------- Horizontal and vertical layouts ---------- */
// Horizontal is a 12 × 8 grid, vertical (portrait monitor) is 8 × 12. Each zone keeps both positions:
// x/y/w/h is the one in use, z.alt is the other, and z.o says which orientation x/y/w/h belongs to.
let ORIENT = 'h', COLS = 12, ROWS = 8;
const allZoneLists = () => [state.zones, ...((state.pages && state.pages.list) || []).map(pg => pg.zones || (pg.zones = []))];
const wantOrient = () => { const m = state.display.orient || 'h'; return m === 'auto' ? (innerHeight > innerWidth * 1.05 ? 'v' : 'h') : m; };
// Fits zones that have no position yet for this orientation into the free space, keeping their order and rough size.
function packZones(list, target){
  const C = target === 'v' ? 8 : 12, R = target === 'v' ? 12 : 8;
  const occ = Array.from({length:R}, () => new Array(C).fill(false));
  const mark = z => { for (let y = z.y; y < z.y + z.h && y <= R; y++) for (let x = z.x; x < z.x + z.w && x <= C; x++) occ[y - 1][x - 1] = true; };
  const fits = (x, y, w, h) => { if (x + w - 1 > C || y + h - 1 > R) return false; for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (occ[j - 1][i - 1]) return false; return true; };
  list.filter(z => z.o === target).forEach(mark);
  const todo = list.filter(z => z.o !== target).sort((a, b) => a.y - b.y || a.x - b.x);
  if (!todo.length) return;
  const sizes = todo.map(z => {
    const w = target === 'v' ? (z.w >= 6 ? 8 : z.w >= 3 ? 4 : 2) : Math.min(12, Math.max(3, z.w >= 6 ? 6 : z.w));
    return {w, h:Math.max(1, Math.round(z.w * z.h / w))};
  });
  let free = 0; occ.forEach(r => r.forEach(c => { if (!c) free++; }));
  const need = sizes.reduce((a, q) => a + q.w * q.h, 0);
  let need2 = need;
  while (need2 > free){ const t = sizes.reduce((m, q) => q.h > m.h ? q : m, sizes[0]); if (t.h <= 1) break; t.h--; need2 -= t.w; }
  todo.forEach((z, k) => {
    const q = sizes[k]; let spot = null;
    for (let h = q.h; h >= 1 && !spot; h--) for (let w = q.w; w >= Math.min(q.w, 2) && !spot; w--)
      for (let y = 1; y <= R && !spot; y++) for (let x = 1; x <= C && !spot; x++) if (fits(x, y, w, h)) spot = {x, y, w, h};
    if (!spot) spot = {x:1, y:R, w:Math.min(q.w, C), h:1};
    Object.assign(z, spot); z.o = target; mark(z);
  });
  // stretch new zones down into any empty space left below them
  todo.slice().sort((a, b) => b.y - a.y).forEach(z => {
    while (z.y + z.h <= R && fits(z.x, z.y + z.h, z.w, 1)){ for (let i = z.x; i < z.x + z.w; i++) occ[z.y + z.h - 1][i - 1] = true; z.h++; }
  });
}
function orientZones(list, target){
  list.forEach(z => {
    z.o = z.o || 'h';
    if (z.o === target) return;
    const cur = {x:z.x, y:z.y, w:z.w, h:z.h};
    if (z.alt){ Object.assign(z, z.alt); z.o = target; }  // already has a layout for this orientation
    z.alt = cur;                                          // without one, packZones gives it one
  });
  packZones(list, target);
}
function applyOrient(force){
  const t = wantOrient();
  if (t === ORIENT && !force) return false;
  ORIENT = t; COLS = t === 'v' ? 8 : 12; ROWS = t === 'v' ? 12 : 8;
  allZoneLists().forEach(l => orientZones(l, t));
  const r = document.documentElement.style; r.setProperty('--cols', COLS); r.setProperty('--rows', ROWS);
  document.body.classList.toggle('vertical', t === 'v');
  const gd = $('#guides'); gd.innerHTML = ''; for (let i = 0; i < COLS * ROWS; i++) gd.appendChild(document.createElement('i'));
  return true;
}
let orientT;
addEventListener('resize', () => { clearTimeout(orientT); orientT = setTimeout(() => { if (state.display.orient === 'auto' && applyOrient()){ finishDissolve(); save(); render(); } }, 400); });

/* ---------- Undo ---------- */
const UNDO = []; let undoBase = null, undoT = null;
// Remembers how things were before each round of changes (changes within a second count as one).
function pushUndo(){
  const now = JSON.stringify(state);
  if (undoBase && undoBase !== now && UNDO[UNDO.length - 1] !== undoBase){ UNDO.push(undoBase); if (UNDO.length > 40) UNDO.shift(); }
  undoBase = now; updUndo();
}
function trackUndo(){ if (!undoBase) return; clearTimeout(undoT); undoT = setTimeout(pushUndo, 900); }
function undo(){
  clearTimeout(undoT);
  const cur = JSON.stringify(state);
  if (undoBase && undoBase !== cur){ UNDO.push(undoBase); }
  const prev = UNDO.pop(); if (!prev){ toast('Nothing to undo'); return; }
  finishDissolve(); state = JSON.parse(prev); undoBase = prev;
  try { localStorage.setItem(KEY, prev); } catch(e){}
  closeDrawer(); ORIENT = ''; applyOrient(true); applyPalette(state.palette); applyDim(); applyScreen();
  if (curPage >= pageCount()) curPage = 0;

/* ---------- Auto-sizing ---------- */
// Grows or shrinks a zone by whole grid rows so its content fits, nudging the zone below.
let fitBudget = 0, fitReset;
function autoFit(z, root){
  if (!root.isConnected || fitBudget > 6 || !root.lastElementChild) return;
  const g = grid.getBoundingClientRect(), gap = parseFloat(getComputedStyle(grid).rowGap) || 0;
  const rowPx = (g.height - gap * (ROWS - 1)) / ROWS + gap;
  if (!(rowPx > 10) || !root.clientHeight) return;
  const last = root.lastElementChild;
  const over = (last.offsetTop + last.offsetHeight - root.offsetTop + 6) - root.clientHeight;
  const dh = over > 1 ? Math.ceil(over / rowPx) : -over > rowPx ? -Math.floor(-over / rowPx) : 0;
  if (dh && resizeZone(z, dh)){
    fitBudget++; clearTimeout(fitReset); fitReset = setTimeout(() => fitBudget = 0, 3000);
    save(); render();
  }
}
function resizeZone(z, dh){
  const sameCols = b => b !== z && b.x < z.x + z.w && b.x + b.w > z.x;
  const others = Z().filter(sameCols), oldB = z.y + z.h;
  if (dh > 0){
    let nh = Math.min(z.h + dh, ROWS + 1 - z.y);
    others.forEach(b => { if (b.y >= oldB) nh = Math.min(nh, b.y + b.h - 1 - z.y); }); // zones below keep at least one row
    if (nh <= z.h) return false;
    const newB = z.y + nh;
    others.forEach(b => { if (b.y >= oldB && b.y < newB){ const bottom = b.y + b.h; b.y = newB; b.h = bottom - newB; } });
    z.h = nh; return true;
  }
  const nh = Math.max(1, z.h + dh); if (nh === z.h) return false;
  const newB = z.y + nh;
  others.forEach(b => {
    if (b.y !== oldB) return;
    const blocked = Z().some(o => o !== z && o !== b && o.x < b.x + b.w && o.x + o.w > b.x && o.y < oldB && o.y + o.h > newB);
    if (!blocked){ b.h += b.y - newB; b.y = newB; }
  });
  z.h = nh; return true;
}

/* ---------- Dragging zones in edit mode ---------- */
let dragMoved = false;
function startDrag(e, z, el, mode){
  if (e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const g = grid.getBoundingClientRect(), cs = getComputedStyle(grid);
  const gx = parseFloat(cs.columnGap) || 0, gy = parseFloat(cs.rowGap) || 0;
  const stepX = (g.width - gx * (COLS - 1)) / COLS + gx, stepY = (g.height - gy * (ROWS - 1)) / ROWS + gy;
  const s0 = {x:e.clientX, y:e.clientY, X:z.x, Y:z.y, W:z.w, H:z.h};
  const label = $('.in', el);
  el.setPointerCapture(e.pointerId); el.classList.add('dragging');
  dragMoved = false;
  const move = ev => {
    const dx = Math.round((ev.clientX - s0.x) / stepX), dy = Math.round((ev.clientY - s0.y) / stepY);
    if (Math.abs(ev.clientX - s0.x) + Math.abs(ev.clientY - s0.y) > 4) dragMoved = true;
    if (mode === 'move'){ z.x = clamp(s0.X + dx, 1, COLS + 1 - z.w); z.y = clamp(s0.Y + dy, 1, ROWS + 1 - z.h); }
    if (mode.includes('e')) z.w = clamp(s0.W + dx, 1, COLS + 1 - s0.X);
    if (mode.includes('s')) z.h = clamp(s0.H + dy, 1, ROWS + 1 - s0.Y);
    if (mode.includes('w')){ const nx = clamp(s0.X + dx, 1, s0.X + s0.W - 1); z.w = s0.W + s0.X - nx; z.x = nx; }
    if (mode.includes('n')){ const ny = clamp(s0.Y + dy, 1, s0.Y + s0.H - 1); z.h = s0.H + s0.Y - ny; z.y = ny; }
    el.style.gridColumn = `${z.x} / span ${z.w}`; el.style.gridRow = `${z.y} / span ${z.h}`;
    label.dataset.size = `${z.w} × ${z.h}`;
  };
  const end = () => {
    el.removeEventListener('pointermove', move);
    el.classList.remove('dragging');
    setTimeout(() => { dragMoved = false; }, 0); // the click that follows a drag is ignored, nothing later
    const changed = z.x !== s0.X || z.y !== s0.Y || z.w !== s0.W || z.h !== s0.H;
    if (!changed) return;
    if (z.type === 'clock' && z.h !== s0.H && z.opts.fit !== 'no'){ z.opts.fit = 'no'; toast('Auto-fit is off for this clock, so the size you set stays.'); }
    save(); render();
    if (drawer.classList.contains('open') && selId === z.id) buildDrawer(z);
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', end, {once:true});
  el.addEventListener('pointercancel', end, {once:true});
}

let live = [], editing = false, selId = null, firstRender = true;

        hnd.addEventListener('pointerdown', e => startDrag(e, z, el, m)); el.appendChild(hnd);

    }
  }
}
function tickSecond(){ live.forEach(l => l.second && l.second()); }

// Animated zones redraw at 30 fps (4 fps in Light motion); only the ticker runs at full rate.
let last = performance.now(), lastDraw = 0;
const calm = () => reduce || state.motion === 'light' || nightNow;
const perf = {on:false, frames:0, worst:0, since:0, el:null};
function togglePerf(){
  perf.on = !perf.on; perf.el = $('#fps'); perf.el.hidden = !perf.on;
  perf.since = performance.now(); perf.frames = 0; perf.worst = 0; perf.el.textContent = 'Measuring…';
}
function loop(t){
  const raw = t - last;
  const dt = Math.min(50, raw); last = t;
  if (perf.on){
    perf.frames++; perf.worst = Math.max(perf.worst, raw);
    if (t - perf.since >= 1000){
      perf.el.textContent = `${Math.round(perf.frames * 1000 / (t - perf.since))} fps\nslowest frame ${Math.round(perf.worst)} ms\nmotion: ${state.motion || 'full'}  ·  press P to hide`;
      perf.frames = 0; perf.worst = 0; perf.since = t;
    }
  }
  tickerFrame(t); BG.frame(t);
  const every = reduce ? 1000 : state.motion === 'light' || nightNow ? 250 : 33;
  if (t - lastDraw >= every && !(dissolving && dissolving.fading)){ const fdt = Math.min(250, t - lastDraw); lastDraw = t; live.forEach(l => l.frame && l.frame(t, fdt)); }
  requestAnimationFrame(loop);
}
setInterval(() => { if (!(dissolving && dissolving.fading)) tickSecond(); }, 1000);

/* ---------- Editing ---------- */
let rt;
function commit(){ save(); clearTimeout(rt); rt = setTimeout(render, 220); }

function field(label, input){
  const w = document.createElement('label'); w.className = 'f';
  const s = document.createElement('span'); s.textContent = label;
  w.append(s, input); return w;
}
function selectEl(options, val){
  const s = document.createElement('select'); let grp = null;
  options.forEach(([v, l]) => {
    if (v === '__group'){ grp = document.createElement('optgroup'); grp.label = l; s.appendChild(grp); return; }
    const o = document.createElement('option'); o.value = v; o.textContent = l; (grp || s).appendChild(o);

}

function buildDrawer(z){
  fieldsEl.innerHTML = '';
  const t = TYPES[z.type];

  const title = document.createElement('input'); title.value = z.title || '';
  title.addEventListener('input', () => { z.title = title.value; commit(); });

  const acc = document.createElement('div'); acc.className = 'btnrow acc';
  const ac = Object.assign(document.createElement('input'), {type:'color', value:z.accent || C.accent});
  const acReset = Object.assign(document.createElement('button'), {type:'button', textContent:'Use theme color'});
  ac.addEventListener('input', () => { z.accent = ac.value; commit(); });
  acReset.addEventListener('click', () => { delete z.accent; ac.value = C.accent; save(); render(); });
  acc.append(ac, acReset); fieldsEl.appendChild(field(z.accent ? 'Accent color (this zone only)' : 'Accent color (using the theme’s)', acc));

  const type = selectEl(Object.entries(TYPES).map(([k, v]) => [k, v.label]), z.type);
  type.addEventListener('change', () => {
    z.type = type.value; z.opts = {...TYPES[z.type].defaults};

  const pos = document.createElement('div'); pos.className = 'pos';
  const dims = [['x','Column',COLS],['y','Row',ROWS],['w','Width',COLS],['h','Height',ROWS]];
  const inputs = {};
  dims.forEach(([k, l, max]) => {
    const i = document.createElement('input'); i.type = 'number'; i.min = 1; i.max = max; i.value = z[k];
    i.addEventListener('change', () => {
      z[k] = parseInt(i.value, 10) || 1;

  fieldsEl.appendChild(ph);

  t.fields.forEach(fd => {
    if (fd.when && !fd.when(z)) return;
    const store = fd.shared ? state[fd.shared] : z.opts;
    let inp;
    if (fd.kind === 'secret'){
      inp = Object.assign(document.createElement('input'), {type:'password', value:inboxKey(), autocomplete:'off'});
      inp.addEventListener('change', () => { try { localStorage.setItem(INBOX_KEY_STORE, inp.value.trim()); } catch(e){} render(); });
      fieldsEl.appendChild(field(fd.label, inp)); return;
    }
    if (fd.kind === 'textarea'){ inp = document.createElement('textarea'); inp.value = store[fd.key] || ''; }
    else if (fd.kind === 'select'){ inp = selectEl(fd.options, store[fd.key] || fd.options.find(o => o[0] !== '__group')[0]); }
    else { inp = document.createElement('input'); inp.type = fd.kind === 'datetime' ? 'datetime-local' : fd.kind === 'number' ? 'number' : 'text'; inp.value = store[fd.key] || ''; if (fd.kind === 'number') inp.min = 2; }
    inp.addEventListener(fd.kind === 'select' ? 'change' : 'input', () => { store[fd.key] = inp.value; commit(); if (fd.key === 'mode' || (fd.shared && fd.kind === 'select')) buildDrawer(z); });
    fieldsEl.appendChild(field(fd.label, inp));
  });
  if (t.hint){ const p = document.createElement('p'); p.className = 'hint'; p.textContent = t.hint; fieldsEl.appendChild(p); }
  if (t.diag && z.opts.mode !== 'manual' && z.opts.quotes !== 'no') fieldsEl.appendChild(t.diag(z));
}

/* ---------- Ticker band ---------- */
const tk = {items:[], x:0, half:0, timer:null, paused:false, i:0, swapAt:0, gen:0};

  };

function buildTrack(){
  const tr = $('#tkTrack'); tr.innerHTML = ''; tr.classList.remove('run');
  const add = it => {

    const a = document.createElement('a');
    a.className = 'tk-item' + (isHot(it) ? ' hot' : '') + (it.watch ? ' watch' : '');
    if (it.link){ a.href = it.link; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    if (it.source){ const s = document.createElement('span'); s.className = 'src'; s.textContent = it.source; a.appendChild(s); }

    tr.appendChild(u);
  };

// Each story slides across on its own small, separate browser animation, handled by the graphics side.

function tkAnimate(){
  const tr = $('#tkTrack'); if (!tr || reduce || !tr.animate) return;
  (tk.anims || []).forEach(a => a.cancel()); tk.anims = [];
  tr.classList.remove('run');
  tr.querySelectorAll('[data-clone]').forEach(c => c.remove());
  let units = [...tr.children];
  if (!units.length) return;
  const V = $('#tkView').clientWidth || innerWidth;
  // repeat the stories until one loop is longer than the screen plus the longest story
  let widths = units.map(u => u.offsetWidth), L = widths.reduce((a, b) => a + b, 0);
  if (!(L > 0)) return;

  while (L < V + Math.max(...widths) && units.length < 400){
    orig.forEach(u => { const c = u.cloneNode(true); c.dataset.clone = '1'; tr.appendChild(c); units.push(c); widths.push(u.offsetWidth); L += u.offsetWidth; });
  }

  tr.classList.add('run');

/* ---------- Your alerts ---------- */
const ALERT_TYPES = [['snow','Snow forecast at a place'],['aurora','Aurora chance near a place'],['quake','Earthquake near a place'],['words','News mentions words'],['launch','Rocket launch about to happen']];

  Object.keys(FIRED).forEach(k => { if (Date.now() - FIRED[k] > 10 * 864e5) delete FIRED[k]; });
  try { localStorage.setItem('ops-fired', JSON.stringify(FIRED)); } catch(e){}

}
const kmBetween = (a, b, c, d) => { const R = 6371, x = (c - a) * RAD, y = (d - b) * RAD, s = Math.sin(x / 2) ** 2 + Math.cos(a * RAD) * Math.cos(c * RAD) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(s)); };

  : r.type === 'aurora' ? `${r.min || 20}%+ aurora chance near ${r.place || '?'}`
  : r.type === 'quake' ? `M${r.min || 6}+ earthquake within ${r.radius || 500} km of ${r.place || '?'}`

function alertsApply(){
  alertStops.forEach(f => f()); alertStops = []; clearInterval(launchTimer);
  (state.alerts || []).forEach(r => {
    if (r.off) return;
    if (r.type === 'snow' && r.place){
      alertStops.push(svcSnowPlace(r.place).use(d => {
        if (!d) return;
        const days = Math.max(1, Math.min(7, +r.days || 3)), cm = d.next.slice(0, days).reduce((a, b) => a + b, 0);
        const want = (+r.amount || 30) * (r.units === 'in' ? 2.54 : 1);
        if (cm >= want) fireOnce(`snow:${r.id}:${new Date().toDateString()}`, 20, {k:'Snow alert', h:`${d.name}: ${r.units === 'in' ? (cm / 2.54).toFixed(1) + ' in' : Math.round(cm) + ' cm'} forecast in the next ${days} day${days > 1 ? 's' : ''}`, link:`https://www.windy.com/?${d.lat.toFixed(2)},${d.lon.toFixed(2)},8`}, '❄');
      }));
    }
    if (r.type === 'aurora' && r.place){
      let loc = null;
      resolvePlace(r.place).then(l => { loc = l; }).catch(() => {});
      alertStops.push(svcAurora().use(d => {
        if (!d || !loc) return;
        // aurora can be seen on the northern (or southern) horizon from several hundred km away
        let best = 0; const dir = loc.latitude >= 0 ? 1 : -1;
        for (let k = 0; k <= 6; k++) for (let o = -3; o <= 3; o++) best = Math.max(best, auroraAt(d.grid, loc.latitude + dir * k, loc.longitude + o));
        if (best >= (+r.min || 20)) fireOnce(`aurora:${r.id}`, 6, {k:'Aurora alert', h:`${best}% chance of aurora near ${loc.name}. Look ${dir > 0 ? 'north' : 'south'} after dark.`, link:AURORA_LINK}, '✺');
      }));
    }
    if (r.type === 'quake' && r.place){
      let loc = null;
      resolvePlace(r.place).then(l => { loc = l; }).catch(() => {});
      alertStops.push(svcQuakes().use(d => {
        if (!d || !loc) return;
        d.forEach(q => {
          if (q.mag < (+r.min || 6) || Date.now() - q.time > 3 * 36e5) return;
          const km = kmBetween(loc.latitude, loc.longitude, q.lat, q.lon);
          if (km <= (+r.radius || 500)) fireOnce(`quake:${q.time}:${q.lat}`, 72, {k:'Earthquake alert', h:`M${q.mag.toFixed(1)}, ${Math.round(km)} km from ${loc.name}: ${q.place}`, link:q.url}, '○');
        });
      }));
    }
    if (r.type === 'words' && r.words){

        if (w) fireOnce(`w:${it.title.slice(0, 80)}`, 72, {k:`News: “${w}”`, h:it.title, link:it.link}, '◆'); });
      NEWSBUS.subs.add(check); alertStops.push(() => NEWSBUS.subs.delete(check)); check();
    }

      launchTimer = setInterval(check, 3e4); check();
    }
  });
}

let wakeLock = null;
async function keepAwake(){

    if (!want && wakeLock){ await wakeLock.release(); wakeLock = null; }

}
document.addEventListener('visibilitychange', keepAwake);
addEventListener('pointerdown', () => { if (!wakeLock) keepAwake(); }, {passive:true});

function burnShift(){
  const pts = [[0,0],[3,1],[1,4],[-2,3],[-4,0],[-2,-3],[1,-4],[3,-1]];

setInterval(burnShift, 4 * 6e4);

  document.documentElement.style.setProperty('--ts', ts);

// Living background: drifting, twinkling stars and an optional faint nebula, drawn behind the panels a few times a second.
const BG = (() => {
  const cv = document.createElement('canvas'); cv.className = 'bgfield'; cv.setAttribute('aria-hidden', 'true');
  document.body.prepend(cv);
  const ctx = cv.getContext('2d'); let mode = 'off', level = .6, stars = [], neb = null, w = 0, h = 0, last = 0, nebKey = '';
  const size = () => {
    const dpr = Math.min(1.5, devicePixelRatio || 1); w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stars = Array.from({length:Math.round(w * h / 5200)}, () => ({x:Math.random() * w, y:Math.random() * h, r:Math.random() < .08 ? 1.4 : Math.random() * .9 + .3, p:Math.random() * 6.3, s:.3 + Math.random() * .7}));
    nebKey = '';
  };
  const makeNebula = () => {
    neb = document.createElement('canvas'); neb.width = Math.ceil(w / 3); neb.height = Math.ceil(h / 3);
    const n = neb.getContext('2d'), cols = [C.accent, C.wx || C.warn, C.accent];
    for (let i = 0; i < 6; i++){
      const x = Math.random() * neb.width, y = Math.random() * neb.height, r = (.25 + Math.random() * .35) * Math.max(neb.width, neb.height);
      const g = n.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(cols[i % 3], .16)); g.addColorStop(1, rgba(cols[i % 3], 0));

  };
  const draw = t => {
    ctx.clearRect(0, 0, w, h);
    if (mode === 'off') return;
    if (mode === 'nebula'){ if (nebKey !== C.accent + w + 'x' + h) makeNebula(); ctx.globalAlpha = level; ctx.drawImage(neb, 0, 0, w, h); }
    const drift = calm() ? 0 : t / 1000 * 1.2;
    stars.forEach(st => {

    frame(t){ if (mode === 'off' || t - last < (calm() ? 2000 : 100) || (dissolving && dissolving.fading)) return; last = t; draw(t); }

    let last = 0; for (let i = 0; i < len; i++){ last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; data[i] = last * 3.5; }
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;

  const mine = document.createElement('div'); mine.className = 'rules'; fieldsEl.appendChild(mine);
  const drawMine = () => {
    mine.innerHTML = '';
    (state.presets || []).forEach(pr => {
      const row = document.createElement('div'); row.className = 'rule';
      const t = document.createElement('span'); t.textContent = pr.name;
      const ap = Object.assign(document.createElement('button'), {type:'button', textContent:'Use'}); ap.onclick = () => applyPreset(JSON.parse(JSON.stringify(pr.zones)), pr.name);
      const del = Object.assign(document.createElement('button'), {type:'button', textContent:'Remove', className:'danger'});
      del.onclick = () => { state.presets = state.presets.filter(x => x !== pr); save(); drawMine(); };
      row.append(t, ap, del); mine.appendChild(row);
    });
  };
  drawMine();
  const pn = Object.assign(document.createElement('input'), {type:'text', placeholder:'Name for this layout'});
  const ps = Object.assign(document.createElement('button'), {type:'button', textContent:'Save the main page as a preset'});
  ps.onclick = () => {
    const name = pn.value.trim() || `My layout ${(state.presets || []).length + 1}`;
    const copy = JSON.parse(JSON.stringify(state.zones)); copy.forEach(z => { if (z.o === 'v'){ const c = {x:z.x, y:z.y, w:z.w, h:z.h}; if (z.alt) Object.assign(z, z.alt); z.alt = c; z.o = 'h'; } });
    state.presets = (state.presets || []).concat({name, zones:copy}); save(); pn.value = ''; drawMine(); toast('Saved “' + name + '”');
  };
  fieldsEl.append(field('Save your own', pn), ps);
  head('Rotating pages');
  const pg = state.pages;
  const pgSel = selectEl([['off','Off: stay on the page I choose'],['on','On: rotate through pages']], pg.on);
  pgSel.addEventListener('change', () => { pg.on = pgSel.value; save(); pagesApply(); if (pg.on !== 'on') goPage(0, true);
    toast(pg.on === 'on' ? 'Pages rotate. Page 1 is your original layout.' : 'Rotation off. Back on your original page; switch pages from the page bar.'); });
  fieldsEl.appendChild(field('Pages', pgSel));
  const pgSec = Object.assign(document.createElement('input'), {type:'number', min:15, value:pg.seconds});
  pgSec.addEventListener('input', () => { pg.seconds = pgSec.value; clearTimeout(dt); dt = setTimeout(save, 300); });
  fieldsEl.appendChild(field('Seconds per page', pgSec));
  note('Page 1 is always your original layout. With rotation off the display stays on it, and the page switch at the top (shown when you move the mouse) takes you to the other pages and back. With rotation on, pages pause while you move the mouse. Press 1, 2, 3… to jump to a page. In edit mode, the page bar at the top adds, renames and deletes pages.');
  head('Sound');
  add('Chime for big stories and your alerts', 'chime', 'select', [['off','Off'],['on','On']]);
  add('Engine-room hum', 'hum', 'select', [['off','Off'],['on','On']]);
  add('Hum volume', 'humVol', 'range');
  note('Browsers only allow sound after you click or press a key on the page, so after a reload the hum starts with your first click.');

  head('Your alerts');
  const list = document.createElement('div'); list.className = 'rules'; fieldsEl.appendChild(list);
  const drawRules = () => {
    list.innerHTML = '';
    (state.alerts || []).forEach(r => {
      const row = document.createElement('div'); row.className = 'rule' + (r.off ? ' off' : '');
      const t = document.createElement('span'); t.textContent = ruleText(r);
      const tg = document.createElement('button'); tg.type = 'button'; tg.textContent = r.off ? 'Turn on' : 'Pause';
      tg.onclick = () => { r.off = !r.off; save(); alertsApply(); drawRules(); };
      const del = document.createElement('button'); del.type = 'button'; del.className = 'danger'; del.textContent = 'Remove';
      del.onclick = () => { state.alerts = state.alerts.filter(x => x !== r); save(); alertsApply(); drawRules(); };
      row.append(t, tg, del); list.appendChild(row);
    });
    if (!(state.alerts || []).length){ const p = document.createElement('p'); p.className = 'hint'; p.textContent = 'No alerts yet. Add one below.'; list.appendChild(p); }
  };
  drawRules();
  // new alert form
  const form = document.createElement('div'); form.className = 'rule-new'; fieldsEl.appendChild(form);
  const draft = {type:'snow', place:'Myōkō Kōgen (36.89, 138.18)', amount:'30', units:'cm', days:'3', min:'', radius:'500', words:'', minutes:'15'};
  const drawForm = () => {
    form.innerHTML = '';
    const f = (label, key, kind, opts) => {
      let inp = kind === 'select' ? selectEl(opts, draft[key]) : Object.assign(document.createElement('input'), {type:kind, value:draft[key]});
      inp.addEventListener(kind === 'select' ? 'change' : 'input', () => { draft[key] = inp.value; if (key === 'type'){ draft.min = draft.type === 'aurora' ? '20' : '6'; drawForm(); } });
      form.appendChild(field(label, inp));
    };
    f('New alert', 'type', 'select', ALERT_TYPES);
    if (['snow', 'aurora', 'quake'].includes(draft.type)) f('Place (a name, or a name with coordinates)', 'place', 'text');
    if (draft.type === 'snow'){ f('At least this much snow', 'amount', 'number'); f('Units', 'units', 'select', [['cm','cm'],['in','inches']]); f('Within the next (days)', 'days', 'number'); }
    if (draft.type === 'aurora') f('Chance of at least (%)', 'min', 'number');
    if (draft.type === 'quake'){ f('Magnitude of at least', 'min', 'number'); f('Within (km)', 'radius', 'number'); }
    if (draft.type === 'words') f('Words or names, comma separated', 'words', 'text');
    if (draft.type === 'launch') f('Minutes before liftoff', 'minutes', 'number');
    const go = document.createElement('button'); go.type = 'button'; go.className = 'on'; go.textContent = 'Add alert';
    go.onclick = () => { state.alerts = (state.alerts || []).concat({...draft, id:uid()}); save(); alertsApply(); drawRules(); toast('Alert added: ' + ruleText(draft)); };
    form.appendChild(go);
  };
  drawForm();

  head('Copy this setup to another screen');
  note('Opens your exact layout, sources, alerts and settings on another computer or the TV.');
  const out = document.createElement('textarea'); out.readOnly = true; out.className = 'setup-code'; out.rows = 3;
  const b1 = document.createElement('button'); b1.type = 'button'; b1.textContent = 'Copy a link with this setup';
  b1.onclick = () => { const url = `${location.origin === 'null' ? location.href.split('#')[0] : location.origin + location.pathname}#setup=${encodeURIComponent(toCode(state))}`; out.value = url; out.select();
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast('Link copied. Open it on the other screen.'), () => toast('Select the link below and copy it.')); };
  const b2 = document.createElement('button'); b2.type = 'button'; b2.textContent = 'Copy a setup code';
  b2.onclick = () => { const c = toCode(state); out.value = c; out.select();
    (navigator.clipboard ? navigator.clipboard.writeText(c) : Promise.reject()).then(() => toast('Setup code copied.'), () => toast('Select the code below and copy it.')); };
  const row = document.createElement('div'); row.className = 'btnrow'; row.append(b1, b2);
  fieldsEl.append(row, out);
  const inp = document.createElement('textarea'); inp.placeholder = 'Paste a setup code here to load it'; inp.rows = 3; inp.className = 'setup-code';
  const b3 = document.createElement('button'); b3.type = 'button'; b3.textContent = 'Load pasted setup'; b3.className = 'danger';
  b3.onclick = () => { try { applySetup(fromCode(inp.value)); } catch(e){ toast('That code didn’t work. Copy it again in full.'); } };
  fieldsEl.append(field('Load a setup (replaces this screen’s layout)', inp), b3);
  drawer.classList.add('open');
}

/* ---------- Controls ---------- */
// Builds a full theme around any one color: dark panels and lines tinted with its hue,
// plus a warning color and a weather-marker color from the opposite side of the color wheel.
function hslHex(h, s, l){
  h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)))).toString(16).padStart(2, '0');
  return '#' + f(0) + f(8) + f(4);
}
function customPalette(hex){
  const n = parseInt((hex || '#5fdc8a').slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d){ h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; }
  const rawSat = d ? d / (1 - Math.abs(mx + mn - 1)) : 0;
  if (rawSat < .12){ // white, grey or black: a neutral steel theme
    return { bg:'#050506', panel:'#0e0f11', line:'#34373c', text:'#dcdee2', dim:'#8a8e95', accent:hslHex(0, 0, Math.max(62, Math.min(88, mx * 100))), hi:'#f4f5f7', warn:'#ffb347', wx:'#ff4fd8' };
  }
  const sat = Math.min(85, Math.max(25, rawSat * 100));
  return {
    bg:hslHex(h, sat * .5, 3), panel:hslHex(h, sat * .55, 7), line:hslHex(h, sat * .5, 20),
    text:hslHex(h, sat * .45, 86), dim:hslHex(h, sat * .25, 56), accent:hslHex(h, Math.max(sat, 70), 62), hi:hslHex(h, 70, 95),
    warn:hslHex(h + 150, 95, 63), wx:hslHex(h + 210, 95, 66)
  };
}
function applyPalette(name){
  C = name === 'custom' ? customPalette(state.customColor) : PALETTES[name] || PALETTES.earth;
  if (!C.war){
    const n = parseInt(C.accent.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255;
    C = {...C, war: r > 200 && g < 140 ? '#ffe14d' : '#ff3348'};  // red, or yellow when the theme itself is red
  }
  if (!C.snow){
    const n = parseInt(C.accent.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
    const bluish = b > r + 30 && b >= g - 10;
    C = {...C, snow: bluish ? '#d9b3ff' : '#a6e3ff'};
  }
  const cc = $('#bColor'); if (cc){ cc.hidden = name !== 'custom'; if (state.customColor) cc.value = state.customColor; }
  const r = document.documentElement.style;
  Object.entries(C).forEach(([k, v]) => r.setProperty('--' + k, v));
  r.setProperty('--glow', rgba(C.accent, .35));
}

let toastT;
function toast(msg){ toastEl.textContent = msg; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 3200); }

$('#bEdit').addEventListener('click', () => setEditing(!editing));
$('#bAdd').addEventListener('click', () => {
  const z = {id:uid(), type:'notes', title:'New zone', x:1, y:1, w:3, h:2, o:ORIENT, opts:{text:''}};
  Z().push(z); save();
  if (!editing) setEditing(true); else render();
  openDrawer(z.id);
});
const pal = $('#bPalette');
pal.value = state.palette || 'earth';
pal.addEventListener('change', () => {
  state.palette = pal.value; applyPalette(pal.value); save();
  if (pal.value === 'custom'){ try { $('#bColor').click(); } catch(e){} }
});
$('#bColor').addEventListener('input', e => { state.customColor = e.target.value; if (state.palette === 'custom') applyPalette('custom'); });
$('#bColor').addEventListener('change', e => { state.customColor = e.target.value; save(); e.target.blur(); });

function fullscreen(){
  const el = document.documentElement;
  if (document.fullscreenElement){ document.exitFullscreen && document.exitFullscreen(); return; }
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req){ toast('Use your browser’s full-screen key (F11) instead.'); return; }
  Promise.resolve(req.call(el)).catch(() => toast('Full screen was blocked here. Open the artifact on its own page, or press F11.'));
}
$('#bFull').addEventListener('click', fullscreen);
$('#bPerf').addEventListener('click', togglePerf);
const ori = $('#bOrient');
ori.value = state.display.orient || 'h';
ori.addEventListener('change', () => {
  state.display.orient = ori.value; finishDissolve();
  if (applyOrient()) toast(ORIENT === 'v' ? 'Vertical layout. Your horizontal layout is kept for when you switch back.' : 'Horizontal layout.');
  save(); closeDrawer(); render();
});
const mo = $('#bMotion');
mo.value = state.motion || 'full'; document.body.classList.toggle('light', mo.value === 'light');
mo.addEventListener('change', () => { state.motion = mo.value; document.body.classList.toggle('light', mo.value === 'light'); save(); });

let resetArmed = false, resetT;
$('#bReset').addEventListener('click', e => {
  if (!resetArmed){ resetArmed = true; e.target.textContent = 'Click again to reset'; resetT = setTimeout(() => { resetArmed = false; e.target.textContent = 'Reset layout'; }, 3000); return; }
  clearTimeout(resetT); resetArmed = false; e.target.textContent = 'Reset layout';
  state = freshLayout(); applyOrient(true); pal.value = state.palette; applyPalette(state.palette); save(); closeDrawer(); render(); tickerApply(); toast('Layout reset');
});

let delArmed = false;
function resetDelete(){ delArmed = false; $('#bDelete').textContent = 'Delete zone'; }
$('#bDelete').addEventListener('click', () => {
  if (!delArmed){ delArmed = true; $('#bDelete').textContent = 'Click again to delete'; return; }
  const zs = Z(), at = zs.findIndex(z => z.id === selId); if (at >= 0) zs.splice(at, 1);
  save(); closeDrawer(); render(); resetDelete(); toast('Zone deleted');
});
$('#bDone').addEventListener('click', closeDrawer);
$('#bNews').addEventListener('click', openNewsSettings);
$('#bUndo').addEventListener('click', undo);
$('#bDisplay').addEventListener('click', openDisplaySettings);
$('#bDim').addEventListener('input', e => { state.display.bright = e.target.value; applyDim(); });
$('#bDim').addEventListener('change', () => save());

addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z')){ e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'e' || e.key === 'E') setEditing(!editing);
  else if (e.key === 'f' || e.key === 'F') fullscreen();
  else if (e.key === 'p' || e.key === 'P') togglePerf();
  else if (/^[1-9]$/.test(e.key) && pagesOn() && +e.key <= pageCount()) goPage(+e.key - 1, true);
  else if (e.key === 'Escape'){ if (drawer.classList.contains('open')) closeDrawer(); else if (editing) setEditing(false); }
});

let idleT;
// Moving the mouse shows the cursor (and a zone's own small menus when you hover it).
// The control bar and page switch appear only when the mouse reaches the middle of the bottom or top edge,
// They stay up while the mouse is over them. (Any movement still pauses rotating pages.)
const B = document.body;
let hudT, pagesT;
function hidePartLater(cls, timerName){
  clearTimeout(timerName === 'hud' ? hudT : pagesT);
  const t = setTimeout(() => { if (!editing && !drawer.classList.contains('open') && !document.querySelector(cls === 'show-hud' ? '#hud:hover, #hud :focus' : '#pagebar:hover, #pagebar :focus')) B.classList.remove(cls); else hidePartLater(cls, timerName); }, 3000);
  if (timerName === 'hud') hudT = t; else pagesT = t;
}
function wake(e){
  B.classList.add('moving'); clearTimeout(idleT);
  idleT = setTimeout(() => { if (!editing && !drawer.classList.contains('open')) B.classList.remove('moving'); }, 3000);
  let hud = true, pages = true;
  if (e && e.type !== 'touchstart'){
    hud = pages = false;
    if (e.clientX != null){
      const midX = Math.abs(e.clientX - innerWidth / 2) < innerWidth * .2, edge = Math.max(70, innerHeight * .1);
      hud = midX && e.clientY > innerHeight - edge;
      pages = midX && e.clientY < edge;
    }
    if (e.target && e.target.closest){ if (e.target.closest('#hud')) hud = true; if (e.target.closest('#pagebar')) pages = true; }
    if (e.type === 'keydown') return;
  }
  if (hud){ B.classList.add('show-hud'); hidePartLater('show-hud', 'hud'); }
  if (pages){ B.classList.add('show-pages'); hidePartLater('show-pages', 'pages'); }
}
['mousemove','mousedown','keydown','touchstart'].forEach(ev => addEventListener(ev, wake, {passive:true}));

document.addEventListener('change', e => { if (e.target.matches('#hud select, .catpick')) e.target.blur(); });

/* ---------- Boot ---------- */

applyPalette(state.palette);
save(); // keeps any upgrades made to an older saved layout
applyDim(); applyScreen(); burnShift(); setInterval(() => { applyDim(); humApply(); }, 3e4);
if (pagesOn() && !state.pages.list.length){ state.pages.list = starterPages(); save(); }
applyOrient(true); save();
render(); drawPageBar(); tickerApply(); wake();
alertsApply(); startWatchers(); checkSetupLink();
undoBase = JSON.stringify(state); updUndo();
requestAnimationFrame(loop);
})();
